name: Build Expansor de Texto

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.cs'
      - '**.csproj'
      - 'app.manifest'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar e publicar (Release, win-x64, single-file, self-contained)
        run: >-
          dotnet publish ExpansorTexto.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Verificar executável e gerar SHA-256
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/ExpansorTexto.exe'
          if (-not (Test-Path $exe)) { throw 'ExpansorTexto.exe não foi gerado.' }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ('Tamanho: {0:N1} MB' -f $size)
          $hash = Get-FileHash $exe -Algorithm SHA256
          Write-Host "SHA-256: $($hash.Hash)"
          "$($hash.Hash)  ExpansorTexto.exe" | Out-File -Encoding ascii 'publish/ExpansorTexto.exe.sha256'

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: expansor-texto-windows-x64
          path: |
            publish/ExpansorTexto.exe
            publish/ExpansorTexto.exe.sha256
          if-no-files-found: error
          retention-days: 30
